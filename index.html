<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सवारी लगबुक र भ्रमण आदेश — प्रवेश</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
  <div class="text-center mb-6">
    <div class="w-24 h-24 mx-auto mb-3 flex items-center justify-center">
      <img src="assets/img/nepal-emblem.png" alt="Nepal Emblem" class="w-24 h-24 object-contain">
    </div>
    <h1 class="text-2xl font-bold text-slate-800">सवारी लगबुक र भ्रमण आदेश</h1>
    <p class="text-slate-500 mt-1 text-sm">Vehicle Logbook &amp; Travel Order System</p>
    <p class="text-xs text-slate-400 mt-1">सुदूरपश्चिम प्रदेश सरकार</p>
  </div>

  <div class="flex mb-6 bg-slate-100 rounded-lg p-1">
    <button id="tabLogin" onclick="showTab('login')"
            class="flex-1 py-2 rounded-md font-semibold text-sm bg-white shadow text-blue-700">
      प्रवेश / Login
    </button>
    <button id="tabRegister" onclick="showTab('register')"
            class="flex-1 py-2 rounded-md font-semibold text-sm text-slate-600">
      दर्ता / Register
    </button>
  </div>

  <form id="loginForm" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">इमेल / Email</label>
      <input type="email" id="loginEmail" required autocomplete="username"
             class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड / Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password"
             class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>
    <button type="submit"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition">
      प्रवेश गर्नुहोस्
    </button>
  </form>

  <form id="registerForm" class="space-y-4 hidden">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">पूरा नाम / Full Name</label>
      <input type="text" id="regName" required
             class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">इमेल / Email</label>
      <input type="email" id="regEmail" required autocomplete="email"
             class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड / Password (min 6)</label>
      <input type="password" id="regPassword" required minlength="6" autocomplete="new-password"
             class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड दोहोर्याउनुहोस्</label>
      <input type="password" id="regPassword2" required minlength="6" autocomplete="new-password"
             class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div id="regError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>
    <button type="submit"
            class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 rounded-lg transition">
      दर्ता गर्नुहोस्
    </button>
  </form>

  <p class="text-xs text-slate-400 mt-6 text-center">
    पहिलो दर्ता गर्ने प्रयोगकर्ता स्वतः एडमिन बन्नेछ।
  </p>
</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/dates.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  DB.init().then(() => {
    if (App.currentUser()) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
